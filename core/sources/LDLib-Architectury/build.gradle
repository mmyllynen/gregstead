plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

if (rootProject != project) {
    def nativeProperties = new Properties()
    file('gradle.properties').withInputStream { nativeProperties.load(it) }
    nativeProperties.each { key, value -> if (!key.startsWith('org.gradle.')) project.ext.set(key, value) }
    layout.buildDirectory = file("build/${rootProject.name}")
}

version = mod_version
group = maven_group

repositories {
    mavenCentral()
    
    maven { url = "https://maven.shedaniel.me/" } // Cloth Config, REI
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    } // Modrinth File
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven { url = "https://maven.parchmentmc.org" } // Parchment mappings
    maven { url = "https://maven.quiltmc.org/repository/release" } // Quilt Mappings
    maven { // Flywheel
        url = "https://maven.tterrag.com/"
        content {
            // need to be specific here due to version overlaps
            includeGroup("com.jozufozu.flywheel")
        }
    }
    // mavens for Forge-exclusives
    maven { url = "https://maven.theillusivec4.top/" } // Curios
    maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu, EMI
    maven { // Create Forge and Registrate Forge
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.tterrag.registrate")
            includeGroup("com.simibubi.create")
        }
    }
    maven { url = "https://jitpack.io/" } // Mixin Extras, Fabric ASM
    maven {
        // latvian.dev Maven (KubeJS and Rhino)
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        // AE2
        url = "https://modmaven.dev/artifactory/local-releases/"
        content {
            includeGroup "appeng"
        }
    }
}

base {
    archivesName = "${project.name}-${minecraft_version}"
}

// Mojang ships Java 21 to end users in 1.20.5+, so your mod should target Java 21.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

neoForge {
    version = neo_version
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))
    validateAccessTransformers = true
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }

}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    runtimeOnly "org.lwjgl:lwjgl-yoga:3.4.3"

    // JEI
    compileOnly("mezz.jei:jei-${integration_minecraft_version}-common-api:${jei_version}") { transitive = false }
    compileOnly("mezz.jei:jei-${integration_minecraft_version}-neoforge-api:${jei_version}") { transitive = false }
    implementation("mezz.jei:jei-${integration_minecraft_version}-neoforge:${jei_version}")

    // REI
    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${rei_version}")
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}")
    compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}")

    // EMI
    implementation(project(':emiNative'))

    // AE2
    compileOnly("appeng:appliedenergistics2-neoforge:${ae2_version}")

    // KJS
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kjs_version}") {
        exclude(group: "dev.architectury")
    }

    //oculus
    compileOnly("maven.modrinth:sodium:${sodium_version}-neoforge")
    compileOnly("maven.modrinth:iris:${iris_version}-neoforge")


    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
}

tasks.withType(ProcessResources).configureEach {
    // set up properties for filling into metadata
    var replaceProperties = [
            "mod_id": mod_id,
            "version": version,
            "loader_version": loader_version,
            "forge_version": neo_version, // only specify major version of forge
            "minecraft_version": minecraft_version,
            "mod_license": mod_license,
            "mod_name": mod_name,
            "mod_description": mod_description,
            "mod_url": mod_url
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url "https://maven.firstdarkdev.xyz/snapshots"
            credentials {
                username System.getenv("MAVEN_USER")
                password System.getenv("MAVEN_PASS")
            }
        }
    }
}

// Keep the full migration diagnostic set visible instead of truncating at 100 errors.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(["-Xmaxerrs", "5000"])
}

// Shared storage and slot APIs are compiled once and bundled with both ported mods.
dependencies { jarJar(api(project(':transferCompat'))) }

neoForge.mods {
    gttransfercompat { sourceSet(project(':transferCompat').sourceSets.main) }
}

neoForge.accessTransformers.from(file("../transfer-compat/src/main/resources/META-INF/accesstransformer.cfg"))

neoForge.mods { emi { sourceSet(project(':emiNative').sourceSets.main) } }



// Resolve the official Yoga module directly from its authoritative Central repository.
repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://repo.maven.apache.org/maven2' } }
        filter { includeModule('org.lwjgl', 'lwjgl-yoga') }
    }
}



// Public distribution: full bundled-license texts and provenance.
tasks.named('jar', Jar) { from('../../../licenses') { into 'META-INF/licenses' } }

pluginManagement {
    repositories {
        
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = "https://maven.quiltmc.org/repository/release" }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.5.0'
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
    versionCatalogs {
        forge {
            from(files("gradle/forge.versions.toml"))
        }
    }
}

rootProject.name = "${mod_id}"

include 'transferCompat'
project(':transferCompat').projectDir = file('../transfer-compat')

include 'registrate'
project(':registrate').projectDir = file('../Registrate')

include 'ldlibNative', 'emiNative'
project(':ldlibNative').projectDir = file('../LDLib-Architectury')
project(':emiNative').projectDir = file('../EMI-native')

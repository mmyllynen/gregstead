plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
layout.buildDirectory = file("build/${rootProject.name}")
group = 'com.tterrag.registrate'
version = 'MC26.3-1.6.0-port.1'
repositories { mavenCentral() }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
neoForge {
    version = '26.3.0.77'


}
dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.44'
    annotationProcessor 'org.projectlombok:lombok:1.18.44'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly 'org.jetbrains:annotations:26.0.2'
}
sourceSets.main.resources.srcDir 'src/generated/resources'
// Upstream generated testmod examples are test fixtures, not library payload.
sourceSets.main.resources.exclude 'data/testmod/**', 'assets/testmod/**'
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}
tasks.jar { manifest.attributes('Automatic-Module-Name': 'com.tterrag.registrate', 'FMLModType': 'GAMELIBRARY') }


// Public distribution: full bundled-license texts and provenance.
tasks.named('jar', Jar) { from('../../../licenses') { into 'META-INF/licenses' } }

name: Build update installers
on:
  push:
    paths: ['updater/**', 'tests/test_updater.py', '.github/workflows/build-installers.yml']
  pull_request:
    paths: ['updater/**', 'tests/test_updater.py', '.github/workflows/build-installers.yml']
  workflow_dispatch:
    inputs:
      bundle_url:
        description: Public Gregstead update ZIP URL (empty builds a synthetic test installer)
        required: false
        type: string
      bundle_sha256:
        description: Exact reviewed SHA-256 of the update ZIP
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: updater/requirements.txt
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y python3-tk xvfb
      - name: Install build dependencies
        run: python -m pip install -r updater/requirements.txt
      - name: Portable updater tests
        run: python -m unittest discover -s tests -p test_updater.py -v
      - name: Prepare the fixed update bundle
        shell: python
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          import os, re, urllib.request, urllib.parse
          from pathlib import Path
          from updater.core import file_sha, read_bundle
          from updater.selftest import write_fixture
          url = os.environ.get('BUNDLE_URL', '')
          if url:
              p = urllib.parse.urlsplit(url)
              if p.scheme != 'https' or p.hostname != 'github.com' or not p.path.startswith('/mmyllynen/gregstead/releases/download/'):
                  raise RuntimeError('Only public Gregstead release assets are supported')
              expected = os.environ.get('BUNDLE_SHA256','')
              if not re.fullmatch('[a-f0-9]{64}', expected):
                  raise RuntimeError('A reviewed SHA-256 is required')
              urllib.request.urlretrieve(url, 'update.zip')
              if file_sha('update.zip') != expected:
                  raise RuntimeError('Update ZIP checksum differs')
              read_bundle('update.zip')
          else:
              write_fixture(Path('update.zip'))
      - name: Build native installer and run packaged engine checks
        run: python -m updater.build --bundle update.zip --output dist/installers
      - name: Native GUI smoke test
        shell: python
        run: |
          import json, subprocess, sys
          from pathlib import Path
          from updater.core import atomic, encoded
          for p in Path('dist/installers').glob('*.build.json'):
              report = json.loads(p.read_text())
              executable = (p.parent / report['filename']).resolve()
              command = [str(executable), '--gui-smoke']
              if sys.platform != 'win32':
                  command = ['xvfb-run', '-a', *command]
              subprocess.run(command, check=True, timeout=90)
              report['guiSmokePassed'] = True
              atomic(p, encoded(report))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gregstead-update-${{ runner.os }}
          path: dist/installers/*
          if-no-files-found: error

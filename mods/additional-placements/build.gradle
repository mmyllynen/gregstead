plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = 'com.firemerald.additionalplacements'
base.archivesName = 'additionalplacements-neoforge-26.3'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
sourceSets.main {
    java.srcDirs = ['common/src/main/java', 'neoforge/src/main/java']
    resources.srcDirs = ['common/src/main/resources', 'common/src/generated', 'neoforge/src/main/resources']
}
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.gameTestImplementation.extendsFrom(configurations.implementation)
configurations.gameTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)
repositories {
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.fabricmc.net' }
}
dependencies {
    compileOnly 'com.simibubi.create:create-1.21.1:6.0.9-215:slim'
    gameTestCompileOnly files('../calm/dist/neogreg-calm-2.2.1+mc26.3.jar', '../calm/libs/curios-neoforge-17.0.0-beta.3+26.3.jar')
}
neoForge {
    version = '26.3.0.77'
    addModdingDependenciesTo(sourceSets.gameTest)
    accessTransformers.from('neoforge/src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file(providers.gradleProperty('packTest').isPresent() ? 'run-pack-tests' : 'run-tests')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'additionalplacements'
        }
        smokeServer {
            server()
            gameDirectory = project.file('run-smoke-server')
            programArguments.addAll '--nogui', '--port', '25587'
            systemProperty 'ap.smokeServer', 'true'
        }
        smokeClient {
            client()
            gameDirectory = project.file('run-smoke-client')
            programArguments.addAll '--quickPlayMultiplayer', '127.0.0.1:25587', '--width', '1280', '--height', '720'
            systemProperty 'ap.smokeClient', 'true'
        }
        curiosRegressionServer {
            server()
            gameDirectory = project.file('run-curios-server')
            programArguments.addAll '--nogui', '--port', '25588'
            systemProperty 'ap.curiosRegression', 'true'
        }
        curiosRegressionClient {
            client()
            gameDirectory = project.file('run-curios-client')
            programArguments.addAll '--quickPlayMultiplayer', '127.0.0.1:25588', '--width', '1280', '--height', '720'
            systemProperty 'ap.curiosRegressionClient', 'true'
        }
        lushPreview {
            client()
            gameDirectory = file('run-visual')
            programArguments.addAll '--quickPlaySingleplayer', 'Preview', '--width', '1280', '--height', '720'
            systemProperty 'ap.lushPreview', 'true'
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        additionalplacements { sourceSet(sourceSets.main); sourceSet(sourceSets.gameTest) }
    }
}
tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
    exclude 'additionalplacements.accesswidener'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) { from('LICENSE.txt') }

tasks.named('check') { dependsOn tasks.named('gameTestClasses') }

// Match the existing NeoGreg client/server heap budget during validation.
tasks.withType(JavaExec).configureEach { maxHeapSize = '6G' }

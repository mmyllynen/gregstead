plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
version = '0.1.3'
group = 'fi.neogreg'
base { archivesName = 'gregstead-ui-fixes' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
neoForge { version = '26.3.0.77'; mods { neogreg_ui_fixes { sourceSet sourceSets.main } } }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
jar { from('LICENSE') { into 'META-INF' } }

// Compile against the exact, checksum-locked client APIs; never bundle them.
dependencies {
    compileOnly fileTree(dir: 'libs', include: '*.jar')
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.3.20'
}

repositories { mavenCentral() }

plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
version = '0.1.0'
group = 'fi.gregstead'
base { archivesName = 'gregstead-ae2-fixes' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
neoForge { version = '26.3.0.77'; mods { gregstead_ae2_fixes { sourceSet sourceSets.main } } }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
jar { from('LICENSE') { into 'META-INF' } }

// Exact checksum-locked upstream API, never bundled.
dependencies { compileOnly fileTree(dir: 'libs', include: '*.jar') }

// Public artifact identity; internal mod IDs remain unchanged.
tasks.named('jar', Jar) { archiveFileName = "gregstead-ae2-fixes-${project.version}-mc26.3.jar" }

plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
version = '1.0.1'
group = 'fi.neogreg'
base { archivesName = 'gregstead-corpse-persistence' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
neoForge { version = '26.3.0.77'; mods { neogreg_corpse_persistence { sourceSet sourceSets.main } } }
dependencies { compileOnly files('libs/corpse-neoforge-1.1.20+26.3.jar') }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }

jar { from('LICENSE') { into 'META-INF' } }
